<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#FFC72C"/>
  
  <!-- máscara: recorta el hueco de la rueda (queda transparente también en las versiones de una tinta) -->
  <mask id="cut-light" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
    <circle cx="304" cy="326" r="46" fill="#000000"/>
  </mask>
  <g fill="#0B0B0F" mask="url(#cut-light)">
    <!-- tronco de la B -->
    <rect x="128" y="96" width="76" height="320" rx="10"/>
    <!-- panza superior (con su hueco) -->
    <path fill-rule="evenodd" d="M196 96 H300 A72 72 0 0 1 300 240 H196 Z M204 140 H296 A28 28 0 0 1 296 196 H204 Z"/>
    <!-- mitad inferior: bloque que une el tronco con la rueda -->
    <rect x="196" y="236" width="108" height="180"/>
    <!-- rueda: la panza inferior de la B -->
    <circle cx="304" cy="326" r="90"/>
  </g>
  <!-- centro de la rueda: damero de 2 x 2 recortado en círculo -->
  <clipPath id="hub-light"><circle cx="304" cy="326" r="30"/></clipPath>
  <g clip-path="url(#hub-light)">
    <rect x="274" y="296" width="30" height="30" fill="#0B0B0F"/>
    <rect x="304" y="326" width="30" height="30" fill="#0B0B0F"/>
    <rect x="274" y="326" width="30" height="30" fill="#FFC72C"/>
       <rect x="304" y="296" width="30" height="30" fill="#FFC72C"/>
  </g>
  <circle cx="304" cy="326" r="30" fill="none" stroke="#0B0B0F" stroke-width="5"/>
</svg>
